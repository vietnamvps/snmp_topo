services:
  opnsense-monitor:
    image: ghcr.io/vietnamvps/snmp_topo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DEVICES_FILE: /app/config/devices.yaml
    ports:
      # To expose to a LAN, set BIND_IP to the server LAN IP and restrict access at the firewall.
      - "${BIND_IP:-127.0.0.1}:${PUBLISH_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
