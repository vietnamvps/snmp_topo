services:
  opnsense-monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DEVICES_READ_ONLY: 'true'
      DEVICES_FILE: /app/config/devices.yaml
    ports:
      # To expose to a LAN, set BIND_IP to the server LAN IP and restrict access at the firewall.
      - "${BIND_IP:-127.0.0.1}:${PUBLISH_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./config/devices.yaml
        target: /app/config/devices.yaml
        read_only: true
        bind:
          create_host_path: false
